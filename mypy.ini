# Type checking for the app code (tests are exercised by pytest instead).
#   python -m mypy
[mypy]
files = api.py, ask.py, compare_ride.py, compose_route.py, edit_route.py, find_spot.py, routes, scripts
python_version = 3.11
# every function must be fully annotated -- new code can't quietly opt out
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
# third-party packages without stubs (fitparse, ...)
ignore_missing_imports = True
