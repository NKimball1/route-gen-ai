name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      # The offline suite needs no API keys and no routing server: HTTP is
      # mocked and the live NL corpus stays skipped without RUN_LLM_TESTS.
      - name: Run tests
        run: python -m pytest tests/ -q
      # mypy.ini requires every function to be fully annotated
      - name: Type check
        run: python -m mypy
