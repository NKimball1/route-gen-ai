<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Route Gen AI</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { --bg:#101418; --panel:#1a2027; --ink:#e8edf2; --dim:#8b98a5;
          --accent:#ff6b35; --line:#2a323c; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; font:14px/1.45 system-ui,sans-serif;
         background:var(--bg); color:var(--ink); }
  #side { width:400px; min-width:320px; display:flex; flex-direction:column;
          border-right:1px solid var(--line); background:var(--panel); }
  #side header { padding:14px 16px 10px; border-bottom:1px solid var(--line); }
  #side h1 { margin:0; font-size:17px; }
  #side h1 span { color:var(--accent); }
  #current { font-size:12px; color:var(--dim); margin-top:4px; word-break:break-all; }
  #askbox { padding:12px 16px; border-bottom:1px solid var(--line); }
  #ask { width:100%; min-height:64px; resize:vertical; background:var(--bg);
         color:var(--ink); border:1px solid var(--line); border-radius:8px;
         padding:9px 10px; font:inherit; }
  #go { margin-top:8px; width:100%; padding:9px; border:0; border-radius:8px;
        background:var(--accent); color:#fff; font:600 14px system-ui; cursor:pointer; }
  #go:disabled { opacity:.5; cursor:wait; }
  #hints { font-size:11.5px; color:var(--dim); margin-top:8px; }
  #hints code { color:var(--ink); }
  #results { overflow-y:auto; flex:0 0 auto; max-height:38%; }
  .cand { padding:9px 16px; border-bottom:1px solid var(--line); cursor:pointer;
          display:flex; align-items:center; gap:9px; }
  .cand:hover { background:#20272f; }
  .dot { width:11px; height:11px; border-radius:50%; flex:none; }
  .cand .label { flex:1; font-size:12.5px; }
  .cand a, .cand button { font-size:11px; color:var(--accent); background:none;
        border:1px solid var(--line); border-radius:6px; padding:3px 7px;
        cursor:pointer; text-decoration:none; }
  #log { flex:1; overflow-y:auto; padding:10px 16px; font:11.5px/1.5 ui-monospace,monospace;
         color:var(--dim); white-space:pre-wrap; }
  #map { flex:1; }
</style>
</head>
<body>
<div id="side">
  <header>
    <h1>Route <span>Gen</span> AI</h1>
    <div id="current">no current route</div>
  </header>
  <div id="askbox">
    <textarea id="ask" placeholder="give me a 40 mile loop from home, not much climbing&#10;&#10;find a flat spot for 2x20 within 30 min&#10;&#10;detour around Pheasant Branch, use roads"></textarea>
    <button id="go">Send</button>
    <div id="hints">Routes, interval spots, and edits to the current route all
      go in the same box. Edits chain — the last winner (or whatever you
      <code>use</code>) is what gets edited.</div>
  </div>
  <div id="results"></div>
  <div id="log">Ready. The self-hosted router must be running
(start_brouter.cmd).</div>
</div>
<div id="map"></div>
<script>
const COLORS = ['#ff6b35','#4dabf7','#69db7c','#ffd43b','#da77f2','#ff8787',
                '#3bc9db','#a9e34b'];
const map = L.map('map').setView([43.05, -89.48], 11);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
            {attribution:'&copy; OpenStreetMap'}).addTo(map);
let layers = [];

async function refreshCurrent() {
  const r = await fetch('/api/current').then(r => r.json());
  document.getElementById('current').textContent =
      r.current ? 'current route: ' + r.current : 'no current route';
}
refreshCurrent();

function showResult(result) {
  layers.forEach(l => map.removeLayer(l));
  layers = [];
  const box = document.getElementById('results');
  box.innerHTML = '';
  let bounds = null;
  result.candidates.forEach((c, i) => {
    const color = COLORS[i % COLORS.length];
    const line = L.polyline(c.latlngs, {color, weight: i === 0 ? 5 : 3,
                                        opacity: i === 0 ? 0.95 : 0.6});
    line.addTo(map);
    layers.push(line);
    bounds = bounds ? bounds.extend(line.getBounds()) : line.getBounds();
    const row = document.createElement('div');
    row.className = 'cand';
    row.innerHTML = `<span class="dot" style="background:${color}"></span>
      <span class="label">${c.label}</span>
      <a href="/api/gpx?path=${encodeURIComponent(c.gpx)}">gpx</a>
      <button data-p="${c.gpx}">use</button>`;
    row.onclick = () => { map.fitBounds(line.getBounds(), {padding:[30,30]});
                          line.bringToFront(); };
    row.querySelector('button').onclick = async (ev) => {
      ev.stopPropagation();
      await fetch('/api/current', {method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({text: c.gpx})});
      refreshCurrent();
    };
    box.appendChild(row);
  });
  if (bounds) map.fitBounds(bounds, {padding:[30,30]});
}

async function send() {
  const text = document.getElementById('ask').value.trim();
  if (!text) return;
  const go = document.getElementById('go');
  const log = document.getElementById('log');
  go.disabled = true;
  log.textContent = '...\n';
  try {
    const {job} = await fetch('/api/ask', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({text})}).then(r => r.json());
    while (true) {
      await new Promise(r => setTimeout(r, 1200));
      const j = await fetch('/api/job/' + job).then(r => r.json());
      log.textContent = j.log || '...';
      log.scrollTop = log.scrollHeight;
      if (j.status === 'done') { showResult(j.result); refreshCurrent(); break; }
      if (j.status === 'error') break;
    }
  } finally { go.disabled = false; }
}
document.getElementById('go').onclick = send;
document.getElementById('ask').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) send();
});
</script>
</body>
</html>
