<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2715%27 fill=%27%23151a20%27/%3E%3Cpath d=%27M7 21 L13 11 L18 19 L22 13 L26 21%27 fill=%27none%27 stroke=%27%23ff7a3d%27 stroke-width=%273%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<title>Route Gen AI</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { --bg:#101418; --panel:#1a2027; --ink:#e8edf2; --dim:#8b98a5;
          --accent:#ff6b35; --line:#2a323c; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; font:14px/1.45 system-ui,sans-serif;
         background:var(--bg); color:var(--ink); }
  #side { width:400px; min-width:320px; display:flex; flex-direction:column;
          border-right:1px solid var(--line); background:var(--panel); }
  #side header { padding:14px 16px 10px; border-bottom:1px solid var(--line); }
  #side h1 { margin:0; font-size:17px; }
  #side h1 span { color:var(--accent); }
  #startrow { display:flex; gap:6px; margin-top:9px; }
  #start { flex:1; background:var(--bg); color:var(--ink);
           border:1px solid var(--line); border-radius:7px; padding:6px 9px;
           font:13px system-ui; }
  #start.unset { border-color:var(--accent); }
  #setstart { border:0; border-radius:7px; background:#2a323c; color:var(--ink);
              padding:6px 11px; cursor:pointer; }
  #current { font-size:12px; color:var(--dim); margin-top:6px; word-break:break-all; }
  #askbox { padding:12px 16px; border-bottom:1px solid var(--line); }
  #ask { width:100%; min-height:64px; resize:vertical; background:var(--bg);
         color:var(--ink); border:1px solid var(--line); border-radius:8px;
         padding:9px 10px; font:inherit; }
  #intent { display:block; width:100%; margin:4px 0 8px; padding:6px; background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:6px; }
  #go { margin-top:8px; width:100%; padding:9px; border:0; border-radius:8px;
        background:var(--accent); color:#fff; font:600 14px system-ui; cursor:pointer; }
  #go:disabled { opacity:.5; cursor:wait; }
  #hints { font-size:11.5px; color:var(--dim); margin-top:8px; }
  #hints code { color:var(--ink); }
  #banner { display:none; margin:0; padding:10px 16px; font-size:13px;
            border-bottom:1px solid var(--line); }
  #banner.ok { display:block; background:#12351f; color:#7ee2a8;
               border-left:3px solid #2f9e44; }
  #banner.bad { display:block; background:#3b1517; color:#ffa8a8;
                border-left:3px solid #e03131; }
  #banner.warn { display:block; background:#3b2c12; color:#ffd8a8;
                 border-left:3px solid #f08c00; }
  #results { overflow-y:auto; flex:0 0 auto; max-height:38%; }
  .cand { padding:9px 16px; border-bottom:1px solid var(--line); cursor:pointer;
          display:flex; align-items:center; gap:9px;
          border-left:3px solid transparent; }
  .cand:hover { background:#20272f; }
  .cand.selected { border-left-color:var(--accent); background:#20272f; }
  .cand .sel { display:none; color:var(--accent); font-weight:700; }
  .cand.selected .sel { display:inline; }
  .cand.selected button.selbtn { display:none; }
  .dot { width:11px; height:11px; border-radius:50%; flex:none; }
  .cand .label { flex:1; font-size:12.5px; }
  .cand a, .cand button { font-size:11px; color:var(--accent); background:none;
        border:1px solid var(--line); border-radius:6px; padding:3px 7px;
        cursor:pointer; text-decoration:none; }
  #log { flex:1; overflow-y:auto; padding:10px 16px; font:11.5px/1.5 ui-monospace,monospace;
         color:var(--dim); white-space:pre-wrap; }
  #map { flex:1; }
</style>
</head>
<body>
<div id="side">
  <header>
    <div style="display:flex; align-items:baseline; gap:10px;">
      <h1 style="flex:1;">Route <span>Gen</span> AI</h1>
      <a href="/about" style="color:var(--dim); font-size:12px;
         text-decoration:none;">about</a>
    </div>
    <div id="startrow">
      <input id="start" placeholder="Where do your rides start? (address or town)"/>
      <button id="setstart">Set</button>
    </div>
    <div style="display:flex; gap:8px; align-items:center;">
      <div id="current" style="flex:1;">no current route</div>
      <button id="undobtn" title="step back to the previous version"
        style="font-size:11px; background:none; color:var(--dim);
               border:1px solid var(--line); border-radius:6px;
               padding:3px 8px; cursor:pointer;">↩ undo</button>
    </div>
  </header>
  <div id="askbox">
    <label for="intent">Operation</label>
    <select id="intent"><option value="auto">Interpret my request</option><option value="route">New route</option><option value="edit_route">Edit selected route</option><option value="interval_spot">Find interval spot</option></select>
    <textarea id="ask" placeholder="give me a 40 mile loop from home, not much climbing&#10;&#10;find a flat spot for 2x20 within 30 min&#10;&#10;detour around Pheasant Branch, use roads"></textarea>
    <button id="go">Send</button>
    <button id="cancelbtn" hidden title="stop the running request"
        style="width:100%; margin-top:6px; padding:7px; background:#3b2c12;
        color:#ffd8a8; border:0; border-radius:8px; cursor:pointer;">
      Cancel</button>
    <div id="hints">Routes, interval spots, and edits all go in the same box.
      The <b>selected</b> route (✓) is what "detour around X" requests
      modify and what you'd ride — the top result is selected automatically.</div>
  </div>
  <div id="uploadrow" style="padding:8px 16px; border-bottom:1px solid var(--line);">
    <input type="file" id="gpxfile" accept=".gpx" hidden>
    <button id="uploadbtn" style="width:100%; padding:7px; background:#2a323c;
        color:var(--ink); border:0; border-radius:8px; cursor:pointer;">
      Upload a GPX to edit…</button>
  </div>
  <div id="banner"></div>
  <div id="results"></div>
  <div id="log">Ready. The self-hosted router must be running
(start_brouter.cmd).</div>
</div>
<div id="map"></div>
<script src="/assets/app.js"></script>
</body>
</html>
